name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR-branch push fires only the pull_request event (push is filtered to main),
# and superseded runs of the same ref are cancelled — except on main, where every
# merge commit keeps its full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# One pipeline for the whole monorepo:
#   guard-pandas  — invariant I7 (pandas confined to etl/)
#   etl           — offline transform + packages/contracts suites (pure Python)
#   silk_intel    — vendored engine hermetic suite (packages/silk_intel)
#   api           — apps/api ruff + migrations + pytest (Postgres + Redis)
#   web           — apps/web lint + typecheck + build
#   e2e           — apps/web Playwright against mocked APIs (no backend needed)

jobs:
  # Actions minutes are metered (GitHub Free: 2000 min/month for private repos),
  # so PR runs only execute the lanes whose files actually changed. Gating via a
  # job (not workflow-level `paths:`) keeps every check reporting — a skipped job
  # satisfies branch protection, whereas a never-triggered required check blocks
  # the PR forever. Pushes to main always run everything (full record per merge).
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      etl: ${{ steps.filter.outputs.etl }}
      engine: ${{ steps.filter.outputs.engine }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - "apps/api/**"
              - ".github/workflows/ci.yml"
            web:
              - "apps/web/**"
              - ".github/workflows/ci.yml"
            etl:
              - "etl/**"
              - "packages/contracts/**"
              - ".github/workflows/ci.yml"
            engine:
              - "packages/silk_intel/**"
              - ".github/workflows/ci.yml"
            python:
              - "**/*.py"
              - ".github/workflows/ci.yml"

  guard-pandas:
    name: Guard — no pandas outside etl/ (I7)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/check_no_pandas.py

  etl:
    name: ETL + contracts — offline pure-Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.etl == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Both suites are pure Python with no deps beyond pytest, so they share a
      # lane: the world_trade transform (yoy/cagr/transit tagging; the bulk
      # Comtrade download with pandas is Phase 3) and the packages/contracts
      # envelope + adapters (decision #4 / I1 — its conftest puts the package
      # on sys.path, no install step needed).
      - run: pip install pytest
      - run: python -m pytest etl/tests packages/contracts/tests -q

  silk_intel:
    name: Engine — silk_intel hermetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.engine == 'true' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: packages/silk_intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine deps
        # Mirrors Repo A's proven hermetic CI: pinned runtime deps + pytest.
        # pandas arrives transitively via pytrends (test fixtures only).
        run: pip install -r silk_intel/requirements.txt pytest httpx
      - name: Run hermetic engine tests
        # Root conftest puts the engine dir on sys.path and anchors cwd there;
        # pyproject sets testpaths = silk_intel/tests.
        run: python -m pytest

  api:
    name: API — apps/api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: silk
          POSTGRES_PASSWORD: silk
          POSTGRES_DB: silk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U silk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://silk:silk@localhost:5432/silk_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local
      COMTRADE_OFFLINE: "1"
      MOCK_EMIT_ENGAGEMENT: "0"
      SECRET_KEY: ci-secret-key-at-least-32-bytes-long-000
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Migrate (verifies migrations apply cleanly)
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest -q

  web:
    name: Web — apps/web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.ref == 'refs/heads/main'
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # I10 — ar/en catalogs must stay key- and placeholder-identical.
      - run: pnpm check:messages
      - run: pnpm build

  e2e:
    name: Web — Playwright e2e (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
