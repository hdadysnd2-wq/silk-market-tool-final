[project]
name = "silk-export-intelligence"
version = "0.1.0"
description = "Saudi Export Intelligence Platform — Phase 1 MVP backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "starlette>=0.40,<0.42",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.0.1,<5",
    "cryptography>=41.0.0",
    "python-multipart>=0.0.17",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "rapidfuzz>=3.10.0",
    "jinja2>=3.1.4",
    "boto3>=1.35.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "sentry-sdk>=2.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# B008: FastAPI Depends() in defaults is idiomatic.
# UP042: str+Enum is deliberate for SQLAlchemy native-enum compatibility.
ignore = ["B008", "SIM108", "UP042"]

[tool.ruff.lint.per-file-ignores]
# These modules carry long single-line data/prompt/UI strings (bilingual text,
# LLM prompt lines, terminal-formatted demo output) that are clearer unwrapped.
"app/seeds/reference.py" = ["E501"]
"app/seeds/demo_golden_path.py" = ["E501"]
"app/providers/llm/prompts.py" = ["E501"]
"app/providers/maps/mock.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
