# Manual live-smoke gate — prove each vendor adapter against its REAL API.
#
# GitHub Actions only runs workflows in the repo-root .github/workflows/. The
# product's live-smoke harness (apps/api/app/live_smoke.py) was wired to NO
# workflow, so the live vendor paths (Comtrade funnel, observed prices, Anthropic
# vision, mailbox OAuth, cold send) were only ever proven by hand. This lane runs
# that harness on demand with the real keys mirrored from CI secrets.
#
# Fail-closed (the PR #83 pattern): every check SKIPs when its key is absent and
# the run still exits 0, so it is safe to trigger with a partial secret set. The
# harness NEVER sends a cold email or writes to a database — the Smartlead and
# mailbox-send paths are reported as GATED/MANUAL and must be proven by a
# supervised pilot, not automation. Exit is non-zero only if a *configured*
# provider's live probe FAILED.
#
# Trigger: Actions tab → "live-smoke" → Run workflow. Set the secrets below in
# the repo/org CI secrets, using the EXACT names (they map 1:1 to the settings
# the code reads, case-insensitive). Any not set simply SKIP.

name: live-smoke

on:
  workflow_dispatch:
    inputs:
      json:
        description: "Emit machine-readable JSON output"
        type: boolean
        default: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    env:
      # Selects live paths (offline fixtures off) for the data providers.
      COMTRADE_OFFLINE: "0"
      # --- Vendor keys mirrored 1:1 from CI secrets (exact names) -------------
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      LOCALPRICE_API_KEY: ${{ secrets.LOCALPRICE_API_KEY }}
      LOCALPRICE_API_URL: ${{ secrets.LOCALPRICE_API_URL }}
      CORESIGNAL_API_KEY: ${{ secrets.CORESIGNAL_API_KEY }}
      OUTSCRAPER_API_KEY: ${{ secrets.OUTSCRAPER_API_KEY }}
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      ZEROBOUNCE_API_KEY: ${{ secrets.ZEROBOUNCE_API_KEY }}
      SMARTLEAD_API_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
      SMARTLEAD_SEQUENCE_VERIFIED: ${{ secrets.SMARTLEAD_SEQUENCE_VERIFIED }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${{ secrets.MICROSOFT_OAUTH_CLIENT_SECRET }}
      # The harness needs a settings object; a throwaway secret is fine (no DB use).
      SECRET_KEY: ci-live-smoke-secret-key-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Run live-smoke (fail-closed; never sends)
        run: |
          if [ "${{ inputs.json }}" = "true" ]; then
            uv run python -m app.live_smoke --json
          else
            uv run python -m app.live_smoke
          fi

  # Wave 3: the brain path — one REAL product through image/name → HS (live
  # Claude) → world screening (live Comtrade) → top-5 → buyers/snapshot →
  # executive Word report, uploaded as the run's artifact. Fail-closed: SKIPs
  # (exit 0) without ANTHROPIC_API_KEY + COMTRADE_API_KEY. Never sends email.
  brain-path:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: silk
          POSTGRES_PASSWORD: silk
          POSTGRES_DB: silk_smoke
        options: >-
          --health-cmd "pg_isready -U silk" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://silk:silk@localhost:5432/silk_smoke
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local
      COMTRADE_OFFLINE: "0"
      CELERY_TASK_ALWAYS_EAGER: "1"
      CELERY_TASK_EAGER_PROPAGATES: "1"
      SECRET_KEY: ci-live-smoke-secret-key-at-least-32-bytes
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      LOCALPRICE_API_KEY: ${{ secrets.LOCALPRICE_API_KEY }}
      LOCALPRICE_API_URL: ${{ secrets.LOCALPRICE_API_URL }}
      # Hard daily spend ceiling for the whole run (engine silk_usage).
      SILK_PAID_DAILY_CAP: "25"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync dependencies (+ etl for the live Comtrade sync)
        run: |
          uv sync --extra dev
          uv pip install -r ../../etl/requirements.txt
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Run the brain path (fail-closed; never sends)
        run: uv run python -m app.live_smoke_brain --out executive_smoke.docx
      - name: Upload the executive report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executive-report
          path: apps/api/executive_smoke.docx
          if-no-files-found: ignore
